name: CI

# Builds the Minecraft 26.2 Fabric and NeoForge jars of the Tellus fork and runs the core unit
# tests (including TellusReflectionContractTest, which pins the names Tellus reaches by reflection).

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository and core submodule
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Run core unit tests
        run: ./gradlew core:test -PmcVer=26.2.0 --stacktrace

      - name: Build Fabric and NeoForge 26.2 jars
        run: ./gradlew fabric:assemble neoforge:assemble -PmcVer=26.2.0 --stacktrace

      - name: Collect release-shaped jars
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mkdir -p dist
          cp fabric/build/libs/DistantHorizons-fabric-"$VERSION"-26.2.jar \
             neoforge/build/libs/DistantHorizons-neoforge-"$VERSION"-26.2.jar dist/
          ls -l dist

      - name: Upload jars
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: distant-horizons-tellus-jars-${{ github.sha }}
          path: dist/*.jar
          retention-days: 14

      - name: Upload core test reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: core-test-reports-${{ github.sha }}
          path: coreSubProjects/core/build/reports/tests/test
          retention-days: 7
